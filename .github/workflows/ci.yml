name: ci
on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      # The runner's global yarn hands off to .yarn/releases via yarnPath.
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - name: Check build output ('use client' banner, styles.css)
        run: sh scripts/check-dist.sh
      - name: Check component CSS uses tokens only
        run: sh scripts/check-css.sh
      - name: Check package contents
        run: yarn pack --dry-run
      - run: yarn build-storybook
