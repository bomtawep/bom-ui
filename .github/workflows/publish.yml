name: publish
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: yarn install --immutable
      # `yarn npm publish` runs the prepack script (typecheck + build) before packing.
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            yarn npm publish --tag beta
          else
            yarn npm publish
          fi
        env:
          # Read by .yarnrc.yml → npmScopes.bomtawep.npmAuthToken
          # Must be GITHUB_TOKEN (gets packages: write from the permissions block above).
          # A PAT with only read:packages, or any fine-grained PAT, fails with
          # "permission_denied: The token provided does not match expected scopes".
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
