yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Next.js / tsup tooling works most reliably with a classic node_modules layout (no Plug'n'Play).
nodeLinker: node-modules

enableTelemetry: false

# Publishing target for @bomtawep/*. The token comes from the environment only — never commit it.
npmScopes:
  bomtawep:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAuthToken: "${NPM_TOKEN:-}"
    # Yarn ≥4.18 holds back versions younger than 1 day; our own releases should be installable immediately.
    npmMinimalAgeGate: 0
